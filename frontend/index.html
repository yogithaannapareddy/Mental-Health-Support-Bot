<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MindCare - Mental Health Support Assistant</title>

    <link rel="stylesheet" href="/style.css">

</head>


<body>

    <div class="chat-container">

        <!-- Header -->

        <div class="chat-header">

            <div>

                <h1>MindCare</h1>

                <p>Mental Health Support Assistant</p>

            </div>

            <div class="status">

                <span class="status-dot"></span>

                Online

            </div>

        </div>


        <!-- Chat messages -->

        <div
            class="chat-box"
            id="chatBox"
        >

            <div class="message bot-message">

                <div class="avatar">
                    🧠
                </div>

                <div class="message-content">

                    <strong>MindCare</strong>

                    <p>
                        Hello! I'm here to listen and support you.
                        How are you feeling today?
                    </p>

                </div>

            </div>

        </div>


        <!-- Input -->

        <div class="input-area">

            <input
                type="text"
                id="messageInput"
                placeholder="Type how you are feeling..."
                autocomplete="off"
            >

            <button
                type="button"
                id="sendButton"
            >
                Send
            </button>

        </div>


        <!-- Disclaimer -->

        <div class="disclaimer">

            This chatbot provides general emotional support
            and is not a replacement for a qualified
            mental-health professional.

        </div>

    </div>


    <script>

        const messageInput =
            document.getElementById("messageInput");

        const sendButton =
            document.getElementById("sendButton");

        const chatBox =
            document.getElementById("chatBox");


        // ====================================================
        // ADD MESSAGE
        // ====================================================

        function addMessage(message, sender) {

            const messageDiv =
                document.createElement("div");


            if (sender === "user") {

                messageDiv.className =
                    "message user-message";


                const content =
                    document.createElement("div");

                content.className =
                    "message-content";


                const name =
                    document.createElement("strong");

                name.textContent = "You";


                const text =
                    document.createElement("p");

                text.textContent = message;


                content.appendChild(name);
                content.appendChild(text);

                messageDiv.appendChild(content);

            }

            else {

                messageDiv.className =
                    "message bot-message";


                const avatar =
                    document.createElement("div");

                avatar.className = "avatar";

                avatar.textContent = "🧠";


                const content =
                    document.createElement("div");

                content.className =
                    "message-content";


                const name =
                    document.createElement("strong");

                name.textContent = "MindCare";


                const text =
                    document.createElement("p");

                text.textContent = message;


                content.appendChild(name);
                content.appendChild(text);

                messageDiv.appendChild(avatar);
                messageDiv.appendChild(content);

            }


            chatBox.appendChild(messageDiv);

            chatBox.scrollTop =
                chatBox.scrollHeight;

        }


        // ====================================================
        // SEND MESSAGE
        // ====================================================

        async function sendMessage() {

            const message =
                messageInput.value.trim();


            if (message === "") {

                return;

            }


            // Show user's message

            addMessage(
                message,
                "user"
            );


            // Clear input

            messageInput.value = "";


            // Disable button

            sendButton.disabled = true;

            sendButton.textContent =
                "Sending...";


            try {

                console.log(
                    "Sending:",
                    message
                );


                const response =
                    await fetch(
                        "/chat",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                message: message
                            })
                        }
                    );


                console.log(
                    "Status:",
                    response.status
                );


                if (!response.ok) {

                    throw new Error(
                        "Server returned " +
                        response.status
                    );

                }


                const data =
                    await response.json();


                console.log(
                    "Response:",
                    data
                );


                addMessage(
                    data.response,
                    "bot"
                );


            }

            catch (error) {

                console.error(
                    "Error:",
                    error
                );


                addMessage(
                    "Sorry, I could not connect to the server. Please try again.",
                    "bot"
                );

            }


            finally {

                sendButton.disabled = false;

                sendButton.textContent =
                    "Send";

                messageInput.focus();

            }

        }


        // Button click

        sendButton.addEventListener(
            "click",
            sendMessage
        );


        // Enter key

        messageInput.addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {

                    sendMessage();

                }

            }
        );

    </script>

</body>

</html>
